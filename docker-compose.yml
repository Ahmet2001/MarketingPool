# The workers of the pool, on this machine. Railway is replaced by containers, and Supabase by a
# local queue (Postgres + PostgREST) that answers the same /rest/v1 calls.
#
#   python3 docker/make_env.py          # once: writes .env with local queue secrets
#   docker compose up -d --build queue platform-data-worker
#   docker compose logs -f platform-data-worker
#
# Each service reads its own, optional env file from ./env/<service>.env (platform credentials,
# model keys). Those files are never copied into an image.

x-queue-env: &queue-env
  SUPABASE_URL: http://queue
  SUPABASE_SECRET_KEY: ${SERVICE_KEY:?run python3 docker/make_env.py}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python3 docker/make_env.py}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?run python3 docker/make_env.py}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Run once, in this order, when the database is created.
      - ./docker/queue/00_roles.sh:/docker-entrypoint-initdb.d/00_roles.sh:ro
      - ./marketing-agent-assets/social-media-worker/migrations/001_publish_jobs.sql:/docker-entrypoint-initdb.d/10_publish_jobs_001.sql:ro
      - ./marketing-agent-assets/social-media-worker/migrations/002_publish_jobs_idempotency_key.sql:/docker-entrypoint-initdb.d/11_publish_jobs_002.sql:ro
      - ./marketing-agent-assets/platform_data_worker/migrations/001_platform_data_jobs.sql:/docker-entrypoint-initdb.d/20_platform_data_jobs.sql:ro
      - ./marketing-agent-assets/scheduler_worker/migrations/001_scheduler_jobs.sql:/docker-entrypoint-initdb.d/30_scheduler_jobs.sql:ro
      - ./agent/migrations/001_agent_jobs.sql:/docker-entrypoint-initdb.d/40_agent_jobs_001.sql:ro
      - ./agent/migrations/002_agent_jobs_idempotency_key.sql:/docker-entrypoint-initdb.d/41_agent_jobs_002.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?run python3 docker/make_env.py}

  # What the workers call "Supabase". Also reachable from this computer at 127.0.0.1:54321.
  queue:
    image: nginx:alpine
    depends_on: [postgrest]
    ports:
      - "127.0.0.1:54321:80"
    volumes:
      - ./docker/queue/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  platform-data-worker:
    build:
      context: ./marketing-agent-assets
      dockerfile: ../docker/platform-data.Dockerfile
    depends_on: [queue]
    restart: unless-stopped
    environment:
      <<: *queue-env
    env_file:
      - path: ./env/platform-data-worker.env
        required: false

  # Publishes what the queue holds (publish_jobs). Needs platform credentials in
  # ./env/social-media-worker.env before a job can succeed.
  social-media-worker:
    build:
      context: ./marketing-agent-assets/social-media-worker
      dockerfile: ../../docker/node-worker.Dockerfile
    depends_on: [queue]
    restart: unless-stopped
    environment:
      <<: *queue-env
    env_file:
      - path: ./env/social-media-worker.env
        required: false

  # The next two drive a backend's own content endpoints (BACKEND_INTERNAL_URL, e.g. the
  # Karatahta app). They do nothing useful without one, so they only start with:
  #   docker compose --profile backend up -d
  scheduler-worker:
    profiles: [backend]
    build:
      context: ./marketing-agent-assets/scheduler_worker
      dockerfile: ../../docker/node-worker.Dockerfile
    depends_on: [queue]
    restart: unless-stopped
    environment:
      <<: *queue-env
    env_file:
      - path: ./env/scheduler-worker.env
        required: false

  mcp-worker:
    profiles: [backend]
    build:
      context: ./marketing-agent-assets/mcp_worker
      dockerfile: ../../docker/node-worker.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - path: ./env/mcp-worker.env
        required: false

  # The marketing agent, run as a worker: it polls agent_jobs and serves MCP on 8091.
  # Put MODEL_PROVIDER, GEMINI_API_KEY, ... in ./env/agent.env (start from env/agent.env.example).
  agent:
    build:
      context: ./agent
      dockerfile: ../docker/agent.Dockerfile
    depends_on: [queue]
    restart: unless-stopped
    shm_size: "1gb"          # Chromium needs more shared memory than Docker's default
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - agent-data:/data
      # The agent checks a platform-data request against the toolbox manifests before queueing it.
      - ./marketing-agent-assets/toolboxes:/toolboxes:ro
    environment:
      <<: *queue-env
      TOOLBOXES_DIR: /toolboxes
      AGENT_WORKER_MCP_HOST: 0.0.0.0
      AGENT_WORKER_MCP_TOKEN: ${AGENT_MCP_TOKEN:?run python3 docker/make_env.py}
    env_file:
      - path: ./env/agent.env
        required: false

volumes:
  db-data:
  agent-data:
