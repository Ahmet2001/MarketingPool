# Supabase serves its REST API under /rest/v1; PostgREST serves at the root.
# This one rule is the whole difference, so the workers connect unchanged.
server {
    listen 80;
    client_max_body_size 20m;
    location /rest/v1/ {
        proxy_pass http://postgrest:3000/;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
    location = /health { return 200 "ok\n"; }
}
